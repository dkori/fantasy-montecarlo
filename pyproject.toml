[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-montecarlo"
version = "0.1.0"
description = "Monte Carlo fantasy football projections built from sportsbook player-prop odds"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
analysis = ["pandas>=2.0", "pyarrow>=12.0"]

[project.scripts]
ffmc = "ffmc.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
